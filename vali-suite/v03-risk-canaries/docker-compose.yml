version: "3.8"

services:
  logger:
    build:
      context: ./services/logger
    container_name: vali-logger
    ports:
      - "${LOGGER_PORT:-8001}:8001"
    volumes:
      - ./data/logs:/app/logs
      - ./data/sessions:/app/sessions
      - ./data/canaries:/app/canaries
      - ./config:/app/config:ro
    environment:
      - LOGGER_API_KEY=${LOGGER_API_KEY:-vali-logger-secret-key-change-me-v3}
    networks:
      - vali-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 12s
      timeout: 5s
      retries: 5

  web-decoy:
    build:
      context: ./services/web-decoy
    container_name: vali-web-decoy
    ports:
      - "${WEB_DECOY_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
    environment:
      - LOGGER_URL=http://logger:8001
      - LOGGER_API_KEY=${LOGGER_API_KEY:-vali-logger-secret-key-change-me-v3}
      - WEB_DECOY_SECRET=${WEB_DECOY_SECRET:-change-me-to-a-very-long-random-string-v3}
      - ENABLE_ADAPTIVE_DELAY=${ENABLE_ADAPTIVE_DELAY:-true}
      - MIN_DELAY_MS=${MIN_DELAY_MS:-150}
      - MAX_DELAY_MS=${MAX_DELAY_MS:-900}
    depends_on:
      logger:
        condition: service_healthy
    networks:
      - vali-net
    restart: unless-stopped

  ssh-honeypot:
    build:
      context: ./services/ssh-honeypot
    container_name: vali-ssh
    ports:
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - ./data/ssh:/app/data
    environment:
      - LOGGER_URL=http://logger:8001
      - LOGGER_API_KEY=${LOGGER_API_KEY:-vali-logger-secret-key-change-me-v3}
    depends_on:
      logger:
        condition: service_healthy
    networks:
      - vali-net
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    container_name: vali-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./data/logs:/app/logs:ro
      - ./data/sessions:/app/sessions:ro
      - ./data/canaries:/app/canaries:ro
    depends_on:
      - logger
    networks:
      - vali-net
    restart: unless-stopped

networks:
  vali-net:
    driver: bridge

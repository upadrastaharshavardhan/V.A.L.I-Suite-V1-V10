# VALI v2 Configuration

decoy:
  name: "NexusOps Admin"
  version: "2.6.0-internal"
  env_badge: "PROD"

progressive:
  # Minimum actions required to unlock each layer
  unlocks:
    api_docs:
      min_actions: 4
    staging:
      min_actions: 8
      requires: api_docs
    config_panel:
      min_actions: 12
      requires: staging
    backup_files:
      min_actions: 16
      requires: config_panel

cost:
  adaptive_delay: true
  min_delay_ms: 200
  max_delay_ms: 1200
  login_extra_delay_ms: 400

logging:
  max_events_per_session: 300

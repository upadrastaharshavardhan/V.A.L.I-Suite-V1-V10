version: "3.8"

services:
  logger:
    build:
      context: ./services/logger
    container_name: vali-logger
    ports:
      - "${LOGGER_PORT:-8001}:8001"
    volumes:
      - ./data/logs:/app/logs
      - ./data/sessions:/app/sessions
    environment:
      - LOGGER_API_KEY=${LOGGER_API_KEY:-vali-logger-secret-key-change-me}
    networks:
      - vali-net
    restart: unless-stopped

  web-decoy:
    build:
      context: ./services/web-decoy
    container_name: vali-web-decoy
    ports:
      - "${WEB_DECOY_PORT:-8080}:8080"
    environment:
      - LOGGER_URL=http://logger:8001
      - LOGGER_API_KEY=${LOGGER_API_KEY:-vali-logger-secret-key-change-me}
      - WEB_DECOY_SECRET=${WEB_DECOY_SECRET:-change-me-to-a-long-random-string}
    depends_on:
      - logger
    networks:
      - vali-net
    restart: unless-stopped
    # Extra isolation: no outbound except to logger
    # (in production you would tighten this further with network policies)

  dashboard:
    build:
      context: ./services/dashboard
    container_name: vali-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./data/logs:/app/logs:ro
      - ./data/sessions:/app/sessions:ro
    depends_on:
      - logger
    networks:
      - vali-net
    restart: unless-stopped

networks:
  vali-net:
    driver: bridge
    internal: false   # set to true in high-security deployments (requires careful port publishing)
